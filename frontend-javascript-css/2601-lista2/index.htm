<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function iniciar(){

            const arrayObj = Array.from({ length: 10 }, () => crearObjeto());
            
            document.write(imprimirObjeto(arrayObj[0]));

            let lista = '';
            arrayObj.forEach((element,i) => {
                lista += element['version'];
                if(i !== (arrayObj.length -1)){
                    lista += ' ';
                }
            });
            let ele = crearNodo('p',`Lista: ${lista}`,'');

            let ascendente = arrayObj.map(obj => obj.version).sort((a,b) => a -b).join(', ');
            ele = crearNodo('p',`Lista ascendente: ${ascendente}.`,'');

            let descendente = arrayObj.map(obj => obj.version).sort((a,b) => b - a).join(', ');
            ele = crearNodo('p',`Lista descendente: ${descendente}.`,'');

            
     
            let media = (arrayObj.reduce((accu,actual) => accu + actual.version, 0)) / (arrayObj.length);
            console.log(media);
            ele = crearNodo('p',`Media: ${media.toFixed(2)}.`,'');

            ele = crearNodo('p',`Max: ${ascendente[ascendente.length-1]}.`,'');

            ele = crearNodo('p',`Min: ${ascendente[0]}.`,'');

            let suma = arrayObj.map(obj => obj.version).reduce((acc,actual) => acc + actual, 0);
            ele = crearNodo('p',`Suma: ${suma}.`,'');
  
            let filtro = arrayObj.map(obj => obj.version).filter((num) => num >= 0 && num <= 5).join(', ');
            ele = crearNodo('p',`Filtro (0,5): ${filtro}.`,'');
            
            
            
        }

        function crearNodo(tipo, inner, id) {
            let ele = document.createElement(tipo);
            ele.innerText = inner;
            ele.id = id;
            document.body.append(ele);
            return ele;
        }

        function imprimirObjeto(objeto){
            const claves = Object.keys(objeto); //convierte las claves en un array
            let result = '';
            for(let i = 0; i < claves.length; i++){
                result += claves[i] + ': ' + objeto[claves[i]];
                if(i !== claves.length-1){
                    result += ', ';
                } else {
                    result += '.';
                }
            }
            return result;
        }

        function crearObjeto () {
            let nivel = ['A','B','C'];
            return {color: hexAleatorio(), texto: generarPalabra(), nivel: nivel[aleatorio(0,2)], version: aleatorio(0,9)};
        }

        function aleatorio(minimo,maximo){
            return Math.floor(Math.random()*((maximo+1)-minimo) + minimo);  
        }

        function hexAleatorio() {
            let letras = "0123456789ABCDEF";
            let codigo = "#";

            for (let i = 0; i < 6; i++) {
                codigo += letras[Math.floor(Math.random() * 16)];
            }

            return codigo;
        }

        function generarPalabra(){
            let resultado = '';
            let abecedario = 'abcdefghijklmnopqrstuvwxyz';
            let numLetras = aleatorio(1,10);
            for(let i = 0; i < numLetras; i++){
                resultado += abecedario[aleatorio(0,abecedario.length-1)];
            }

            return resultado;
        }

        window.onload = iniciar;
    </script>
</head>
<body>
    
</body>
</html>
