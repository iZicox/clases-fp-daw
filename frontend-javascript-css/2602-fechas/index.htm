<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function iniciar(){

            const n = 24;

            const arrayFehcas = Array.from({length: n }, () => fechaAleatoria(2019));

            let ejemplo = crearNodo("p","Ejemplo de control input type=\"date\" impreso en ISO date.")
            ejemplo.style.fontWeight = 'bold';
            let input = crearNodo("input","");
            input.setAttribute("type", "date");
            input.id = "fecha";

            input.addEventListener("change", () => {
                inputISO.value = new Date(input.value).toISOString();
            });

            let inputISO = crearNodo("input","");
            inputISO.style.marginLeft = '20px';
            inputISO.style.width = '200px';
            inputISO.setAttribute("type", "text");
            inputISO.id = "iso";


            let titulo = crearNodo("p", "Crear 24 fechas en 6 columnas.");
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';
            const contenedorPrincipal = crearNodo('div','');
            contenedorPrincipal.style.display = 'flex';
            contenedorPrincipal.style.flexWrap = 'wrap';
            contenedorPrincipal.style.alignItems = 'center';
            contenedorPrincipal.style.justifyContent = 'center';
            contenedorPrincipal.style.width = '600px';
            contenedorPrincipal.style.border = '1px solid';

            arrayFehcas.forEach((ele) => {
                let temp = new Date(ele.getTime());
                let inner = temp.getDate() + "-" + (temp.getMonth() + 1) + "-" + temp.getFullYear();
                let contenedor = crearContenedor('div', inner);
                contenedor.style.width = '100px';
                contenedor.style.display = 'flex';
                contenedor.style.alignItems = 'center';
                contenedor.style.justifyContent = 'center';
                contenedorPrincipal.appendChild(contenedor);
            })

            //**********       MENOR A MAYOR       **********

            titulo = crearNodo("p", "De menor a mayor.");
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';

            const menorAMayor = arrayFehcas.sort((a,b) => a-b);

            const contenedorMenorAMayor = crearNodo('div','');
            contenedorMenorAMayor.style.display = 'flex';
            contenedorMenorAMayor.style.flexWrap = 'wrap';
            contenedorMenorAMayor.style.alignItems = 'center';
            contenedorMenorAMayor.style.justifyContent = 'center';
            contenedorMenorAMayor.style.width = '600px';
            contenedorMenorAMayor.style.border = '1px solid';

            menorAMayor.forEach((ele) => {
                let temp = new Date(ele.getTime());
                let inner = temp.getDate() + "-" + (temp.getMonth() + 1) + "-" + temp.getFullYear();
                let contenedor = crearContenedor('div', inner);
                contenedor.style.width = '100px';
                contenedor.style.display = 'flex';
                contenedor.style.alignItems = 'center';
                contenedor.style.justifyContent = 'center';
                contenedorMenorAMayor.appendChild(contenedor);
            })

            //**********       MAYOR A MENOR       **********

            titulo = crearNodo("p", "De mayor a menor.");
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';

            const mayorAMenor = arrayFehcas.sort((a,b) => b-a);

            const contenedorMayorAMenor = crearNodo('div','');
            contenedorMayorAMenor.style.display = 'flex';
            contenedorMayorAMenor.style.flexWrap = 'wrap';
            contenedorMayorAMenor.style.alignItems = 'center';
            contenedorMayorAMenor.style.justifyContent = 'center';
            contenedorMayorAMenor.style.width = '600px';
            contenedorMayorAMenor.style.border = '1px solid';

            mayorAMenor.forEach((ele) => {
                let temp = new Date(ele.getTime());
                let inner = temp.getDate() + "-" + (temp.getMonth() + 1) + "-" + temp.getFullYear();
                let contenedor = crearContenedor('div', inner);
                contenedor.style.width = '100px';
                contenedor.style.display = 'flex';
                contenedor.style.alignItems = 'center';
                contenedor.style.justifyContent = 'center';
                contenedorMayorAMenor.appendChild(contenedor);
            })


             //**********       DIFERENCIA       **********

            const diferencias = menorAMayor
                .slice(0,-1) //quitar el ultimo elemento
                .map((date, i) => {
                    const siguiente = menorAMayor[i+1];
                    const diff = date - siguiente; //diferencia en tipo Date
                    return (diff / (1000*60*60*24)).toFixed(0); //convertis ms a dias y enteros
                });


            titulo = crearNodo("p", "Diferencia dias");
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';

            const contenedorDiff = crearNodo('div','');
            contenedorDiff.style.display = 'flex';
            contenedorDiff.style.flexWrap = 'wrap';
            contenedorDiff.style.alignItems = 'center';
            contenedorDiff.style.justifyContent = 'start';
            contenedorDiff.style.width = '800px';
            contenedorDiff.style.border = '1px solid';

            menorAMayor.slice(0,-1).forEach((ele, i) => {
                let temp = new Date(ele.getTime());
                let inner =
                            temp.getDate() + "-"
                            + (temp.getMonth() + 1) + "-"
                            + temp.getFullYear() + " ; "
                            + diferencias[i];

                let contenedor = crearContenedor('div', inner);
                contenedor.style.width = '120px';
                contenedor.style.display = 'flex';
                contenedor.style.alignItems = 'center';
                contenedor.style.justifyContent = 'center';
                contenedorDiff.appendChild(contenedor);
            })

            //**********       MAYOR Y MENOR ENTRE DIAS       **********
            titulo = crearNodo('p','Mayor y menor entre dias');
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';

            const diffOrdenada = diferencias.sort((a,b) => b - a);
            let text = crearNodo('p', 'Mayor: ' + diffOrdenada[0] + '. Menor: ' + diffOrdenada[diffOrdenada.length -1]);
            text.style.marginTop = '0';

            //**********       FECHA MAS ALTA Y MAS BAJA       **********
            titulo = crearNodo('p','Fecha mas alta y mas baja');
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';

            const mayorFecha =  arrayFehcas.sort((a,b) => b - a).slice(0,1)[0];
            const menorFecha =  arrayFehcas.sort((a,b) => a - b).slice(0,1)[0];


            text = crearNodo('p',
                `Mayor:
                    ${mayorFecha.getDate()} -
                    ${mayorFecha.getMonth()+1} -
                    ${mayorFecha.getFullYear()}.
                Menor:
                    ${menorFecha.getDate()} -
                    ${menorFecha.getMonth()+1} -
                    ${menorFecha.getFullYear()}.`
            );
            text.style.marginTop = '0';


            //**********       DIFERENCIA ENTRE LA FECHA MAS ALTA Y MAS BAJA       **********

            titulo = crearNodo('span','Dias entre la fecha mas alta y mas baja');
            titulo.style.marginBottom = '0';
            titulo.style.fontWeight = 'bold';

            text = crearNodo('p',`
                Dias de diferencia
                ${((mayorAMenor[mayorAMenor.length-1] - mayorAMenor[0])/(1000*60*60*24)).toFixed(0)}.
            `);
            text.style.marginTop = '0';



        }

        function fechaAleatoria (anio) {
                const inicio = new Date(anio, 0, 1).getTime();
                const final = new Date(anio, 11, 31).getTime();
                return new Date(aleatorio(inicio,final));
            };

        function aleatorio(minimo,maximo){
            return Math.floor(Math.random()*((maximo+1)-minimo) + minimo);
        }

        function crearContenedor(tipo, inner){
            var ele = document.createElement(tipo);
            ele.innerHTML = inner;
            return ele;
        }

        function crearNodo(tipo, inner){
            var ele = document.createElement(tipo);
            ele.innerHTML = inner;
            document.body.appendChild(ele);
            return ele;
        }

        window.onload = iniciar;
    </script>
</head>
<body>

</body>
</html>
