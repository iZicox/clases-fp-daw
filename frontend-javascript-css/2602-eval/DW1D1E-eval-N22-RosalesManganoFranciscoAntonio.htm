        function crearNodo(tipo, inner){
            var ele = document.createElement(tipo);
            ele.innerHTML = inner;
            document.body.appendChild(ele);
            return ele;
        }

        function ondaAmortiguada(t, A = 1, lambda = 0.1, omega = 1, phi = 0) {
            return A * Math.exp(-lambda * t) * Math.cos(omega * t + phi);
        }
