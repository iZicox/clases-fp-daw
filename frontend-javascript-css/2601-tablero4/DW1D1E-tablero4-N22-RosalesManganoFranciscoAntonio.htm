<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function iniciar(){
            let filas = 8;
            let cols = 8;
            let inner = 'H';
            for(let i = 0; i < filas; i ++){
                for(let j = 0; j < cols; j ++){

                    let identificador = 'caja' + i + j;
                    let ele = crearNodo('div', inner, identificador);
            
                    ele.style.width = '100px';
                    ele.style.height = '100px';
                    ele.style.margin = '10px';
                    ele.style.border = '1px solid';
                    ele.style.backgroundColor = hexAleatorio();
                    ele.style.float = 'left';
                    ele.addEventListener('click', function (){
                        window.alert(identificador)
                    });
                }
                
                //salto de linea con clear
                let salto = crearNodo('div', '', '');
                salto.style.clear = 'both';
                
                   
            }
        }

        function hexAleatorio() {
            let letras = "0123456789ABCDEF";
            let codigo = "#";

            for (let i = 0; i < 6; i++) {
                codigo += letras[Math.floor(Math.random() * 16)];
            }

            return codigo;
        }


        function crearNodo(tipo, inner, identificador){
            var ele = document.createElement(tipo);
            ele.innerHTML = inner;
            ele.id = identificador;
            document.body.appendChild(ele);
            return ele;
        }

        window.onload = iniciar;
    </script>
</head>
<body>
    
</body>
</html>
