<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .z {
            margin: 10px;
            border: 1px solid black;
            width: 300px;
            padding: 10px;
        }

        #mapid {
            width: 600px;
            height: 300px;
        }
    </style>
    <script>
        const coordenadasOslo = [59.913333333333, 10.738888888889];

        function iniciar() {

            console.log('inicio');

            // contenedor mapa
            let contenedor = document.createElement('div');
            document.body.appendChild(contenedor);
            contenedor.id = 'mapid';

            // centro mapa y zoom
            var map = L.map('mapid').setView(coordenadasOslo, 12);
            map.on('zoom', (e) => {
                let zoom = map.getZoom();
                let campo = document.getElementById('zoom');
                campo.value = zoom;
            });

            // tipo de mapa
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 10,
                minZoom: 7,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);


            // icono de hoja
            let greenIcon = L.icon({
                iconUrl: 'leaf-green.png',
                shadowUrl: 'leaf-shadow.png',

                iconSize: [38, 95], 
                shadowSize: [50, 64], 
                iconAnchor: [22, 94], 
                shadowAnchor: [4, 62],  
                popupAnchor: [-3, -76] 
            });

            // insertar marcador
            let marcador = L.marker(coordenadasOslo, { icon: greenIcon }).addTo(map);
            marcador.bindPopup("<b>OSLO</b><br>un marcador").openPopup();

            // campo zoom
            let labelZoom = document.createElement('label');
            labelZoom.innerText = 'zoom ';

            let inputZoom = document.createElement('input');
            inputZoom.id = 'zoom';
            inputZoom.className = 'z';
            inputZoom.placeholder = 'zoom';
            inputZoom.setAttribute('type', 'text');
            labelZoom.appendChild(inputZoom);

            document.body.appendChild(labelZoom);

            saltoLinea();

            // campo coordenadas
            let labelCoo = document.createElement('label');
            labelCoo.innerText = 'coordenadas ';

            let inputCoo = document.createElement('input');
            inputCoo.id = 'coordenadas';
            inputCoo.placeholder = 'coordenadas';
            inputCoo.className = 'z';
            inputCoo.setAttribute('type', 'text');
            labelCoo.appendChild(inputCoo);
            
            document.body.appendChild(labelCoo);


            // evento para actualizar las coordenadas
            function mapClick(e) {
                let coordenadas = document.getElementById('coordenadas');
                coordenadas.value = e.latlng;  
            }
            map.on('click', mapClick);


            saltoLinea();

            // campo circulo 1
            let labelCirculo1 = document.createElement('label');
            labelCirculo1.innerText = 'circulo 1';
            
            let inputCirculo1 = document.createElement('input');
            inputCirculo1.setAttribute('type', 'checkbox');
            labelCirculo1.appendChild(inputCirculo1);

            document.body.appendChild(labelCirculo1);

            saltoLinea();
            saltoLinea();

            // campo circulo 2
            let labelCirculo2 = document.createElement('label');
            labelCirculo2.innerText = 'circulo 2';
            
            let inputCirculo2 = document.createElement('input');
            inputCirculo2.setAttribute('type', 'checkbox');
            labelCirculo2.appendChild(inputCirculo2);

            document.body.appendChild(labelCirculo2);

            saltoLinea();
            saltoLinea();

            // campo cuadrado
            let labelCuadrado = document.createElement('label');
            labelCuadrado.innerText = 'cuadrado';
            
            let inputCuadrado = document.createElement('input');
            inputCuadrado.setAttribute('type', 'checkbox');
            labelCuadrado.appendChild(inputCuadrado);

            document.body.appendChild(labelCuadrado);


            // EVENTOS FIGURAS

            // evento circulo 1

            inputCirculo1.addEventListener('change', () => {
                let ele = document.querySelector('path.circulo1');
                if (ele) {
                    ele.remove();
                } else {
                    let circulo1 = L.circle([60, 10.50], {
                        color: 'blue',
                        fillColor: '#006AFF',
                        fillOpacity: 0.5,
                        radius: 10000,
                        className: 'circulo1'
                    }).addTo(map);
                    circulo1.bindPopup("circulo1");
                }
            });

            // evento circulo 2

            inputCirculo2.addEventListener('change', () => {
                let ele2 = document.querySelector('path.circulo2');
                if (ele2) {
                    ele2.remove();
                } else {
                    let circulo2 = L.circle([59.82, 10.50], {
                        color: 'red',
                        fillColor: '#f03',
                        fillOpacity: 0.5,
                        radius: 10000,
                        className: 'circulo2'
                    }).addTo(map);
                    circulo2.bindPopup("circulo2");
                }
            });

            // evento rectangulo
            inputCuadrado.addEventListener('change', () => {
                let ele = document.querySelector('path.cuadrado1');
                if (ele) {
                    ele.remove();
                } else {
                    var rectangulo = L.polygon([
                        [60, 10.9],
                        [60,    10.679],
                        [59.82, 10.679],
                        [59.82, 10.9]
                    ],{
                        color: 'blue',
                        fillColor: '#B8D5FF',
                        fillOpacity: 0.5,
                        className: 'cuadrado1'
                    }).addTo(map);
                    rectangulo.bindPopup("cuadrado");
                }
            });
        }

        function saltoLinea(){
            let ele = document.createElement('br');
            document.body.appendChild(ele);
        }

        window.onload = iniciar;

    </script>
</head>

<body>

</body>

</html>
