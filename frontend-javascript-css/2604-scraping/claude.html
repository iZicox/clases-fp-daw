<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Scraper de Citas</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .cita { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .autor { font-weight: bold; color: #555; }
    .tags span { background: #eef; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; display: inline-block; }
    button { padding: 0.5rem 1.2rem; margin: 0.5rem; cursor: pointer; border-radius: 6px; border: 1px solid #999; }
  </style>
</head>
<body>
  <h1>Scraper de Citas</h1>
  <button onclick="scrape()">Extraer citas</button>
  <button onclick="descargarJSON()">Guardar JSON</button>
  <button onclick="cargarJSON()">Cargar JSON guardado</button>
  <div id="resultado"></div>

  <script>
    let datosExtraidos = [];

    // ── PASO 3: Extracción ──────────────────────────────────────────
    async function scrape() {
      const url = 'http://quotes.toscrape.com';
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

      document.getElementById('resultado').innerHTML = '<p>Extrayendo...</p>';

      try {
        const response = await fetch(proxy);
        const html = await response.text();

        // Parsear el HTML recibido
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Seleccionar elementos del DOM
        const citas = doc.querySelectorAll('.quote');
        datosExtraidos = Array.from(citas).map(q => ({
          texto: q.querySelector('.text').textContent.trim(),
          autor: q.querySelector('.author').textContent.trim(),
          tags: Array.from(q.querySelectorAll('.tag')).map(t => t.textContent.trim())
        }));

        mostrarDatos(datosExtraidos);
      } catch (err) {
        document.getElementById('resultado').innerHTML = `<p>Error: ${err.message}</p>`;
      }
    }

    // ── PASO 5: Presentación en el navegador ───────────────────────
    function mostrarDatos(datos) {
      const html = datos.map(c => `
        <div class="cita">
          <p>${c.texto}</p>
          <p class="autor">— ${c.autor}</p>
          <div class="tags">${c.tags.map(t => `<span>${t}</span>`).join('')}</div>
        </div>
      `).join('');
      document.getElementById('resultado').innerHTML = html;
    }

    // ── PASO 4: Guardar JSON en disco ──────────────────────────────
    function descargarJSON() {
      if (!datosExtraidos.length) return alert('Primero extrae las citas');
      const blob = new Blob([JSON.stringify(datosExtraidos, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'citas.json';
      a.click();
    }

    // ── PASO 5b: Leer el JSON guardado y mostrarlo ─────────────────
    function cargarJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
          const datos = JSON.parse(ev.target.result);
          datosExtraidos = datos;
          mostrarDatos(datos);
        };
        reader.readAsText(e.target.files[0]);
      };
      input.click();
    }
  </script>
</body>
</html>
