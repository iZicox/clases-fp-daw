<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Scraping</title>
</head>
<script>
    // Variable global para guardar los datos que extractmos
    // Tiene 3 listas: libros, citas, noticias
    let datos_guardados = { libros: [], citas: [], noticias: [] };
    let seccion_actual = null; // Tracks which section is currently active

    // Esta funcion se ejecuta cuando la pagina termina de cargar
    function iniciar() {
        // Obtenemos el elemento body del HTML
        let body = document.body;

        // Creamos el titulo principal
        let titulo = document.createElement("h1");
        titulo.innerText = "Scraping - Archivos Locales";
        body.appendChild(titulo);

        // --- SECCION 1: LIBROS ---
        // Creamos una seccion con titulo "1. Books to Scrape"
        let seccion1 = crearSeccion("1. Books to Scrape");
        // Creamos label con input para seleccionar archivo
        let labelLibros = crearInputArchivo("Seleccionar livros.html");
        // Obtenemos el input dentro del label
        let inputLibros = labelLibros.querySelector("input");
        // Creamos un contenedor vazio para mostrar resultados depois
        let resultadoLibros = crearContenedorResultados();
        
        // Contenedor para el iframe
        let iframeLibros = crearContenedorIframe();
        
        // Botón para exportar JSON individual de libros
        let botonExportarLibros = document.createElement("button");
        botonExportarLibros.innerText = "Exportar JSON";
        botonExportarLibros.style.marginLeft = "10px";
        botonExportarLibros.onclick = () => exportarJsonIndividual("libros", iframeLibros);
        
        // Añadimos el label, el botón y el contenedor a la seccion
        seccion1.appendChild(labelLibros);
        seccion1.appendChild(botonExportarLibros);
        seccion1.appendChild(resultadoLibros);
        seccion1.appendChild(iframeLibros);
        // Añadimos la seccion al body
        body.appendChild(seccion1);

        // --- SECCION 2: CITAS ---
        let seccion2 = crearSeccion("2. Quotes to Scrape");
        let labelCitas = crearInputArchivo("Seleccionar citas.html");
        let inputCitas = labelCitas.querySelector("input");
        let resultadoCitas = crearContenedorResultados();
        let iframeCitas = crearContenedorIframe();
        
        let botonExportarCitas = document.createElement("button");
        botonExportarCitas.innerText = "Exportar JSON";
        botonExportarCitas.style.marginLeft = "10px";
        botonExportarCitas.onclick = () => exportarJsonIndividual("citas", iframeCitas);
        
        seccion2.appendChild(labelCitas);
        seccion2.appendChild(botonExportarCitas);
        seccion2.appendChild(resultadoCitas);
        seccion2.appendChild(iframeCitas);
        body.appendChild(seccion2);

        // --- SECCION 3: NOTICIAS ---
        let seccion3 = crearSeccion("3. Hacker News");
        let labelNoticias = crearInputArchivo("Seleccionar noticias.html");
        let inputNoticias = labelNoticias.querySelector("input");
        let resultadoNoticias = crearContenedorResultados();
        let iframeNoticias = crearContenedorIframe();
        
        let botonExportarNoticias = document.createElement("button");
        botonExportarNoticias.innerText = "Exportar JSON";
        botonExportarNoticias.style.marginLeft = "10px";
        botonExportarNoticias.onclick = () => exportarJsonIndividual("noticias", iframeNoticias);
        
        seccion3.appendChild(labelNoticias);
        seccion3.appendChild(botonExportarNoticias);
        seccion3.appendChild(resultadoNoticias);
        seccion3.appendChild(iframeNoticias);
        body.appendChild(seccion3);

        

        // =============================================
        // EVENTO: LEER ARCHIVO DE LIBROS
        // =============================================
        // Se ejecuta cuando el usuario selecciona un archivo
        inputLibros.onchange = (evento) => {
            seccion_actual = "libros";
            // Obtenemos el primer archivo seleccionado
            let archivo = evento.target.files[0];
            if (!archivo) return; // Si no hay archivo, salir
            
            // FileReader sirve para leer archivos desde el navegador
            let lector = new FileReader();
            
            // Esta funcion se ejecuta cuando termina de leer el archivo
            lector.onload = (e) => {
                // DOMParser convierte el texto HTML en un documento que podemos buscar
                let parser = new DOMParser();
                let documento = parser.parseFromString(e.target.result, "text/html");
                
                // Buscamos todos los elementos que tienen class="product_pod"
                let libros = documento.querySelectorAll("article.product_pod");
                
                // Limpiamos la lista anterior de libros
                datos_guardados.libros = [];
                resultadoLibros.innerHTML = "";

                // Recorremos los primeros 10 libros
                for (let i = 0; i < Math.min(libros.length, 10); i++) {
                    let libro = libros[i];
                    
                    // querySelector busca un elemento dentro de otro
                    // .h3 a busca un elemento con tag h3 y dentro un tag a
                    let enlace = libro.querySelector("h3 a"); // Titulo del libro
                    let imagen = libro.querySelector(".image_container img"); // Imagen
                    let ratingEl = libro.querySelector(".star-rating"); // Rating
                    
                    // Obtenemos el texto del titulo, quitamos espacios al principio y final
                    let rating = ratingEl ? ratingEl.className.split(" ").pop() : "N/A";

                    // Creamos un objeto con los datos del libro
                    let dato = {
                        titulo: enlace?.textContent?.trim() || "Sin titulo",
                        url: enlace?.href || "",
                        imagen: imagen?.src || "",
                        rating: rating
                    };
                    // Guardamos el dato en la lista
                    datos_guardados.libros.push(dato);

                    // Creamos un div para mostrar en pantalla
                    let item = crearItem();
                    item.innerText = dato.titulo + " - " + dato.rating;
                    resultadoLibros.appendChild(item);
                }
            };
            
            // Iniciamos la lectura del archivo como texto
            lector.readAsText(archivo);
        };

        // =============================================
        // EVENTO: LEER ARCHIVO DE CITAS
        // =============================================
        inputCitas.onchange = (evento) => {
            seccion_actual = "citas";
            let archivo = evento.target.files[0];
            if (!archivo) return;
            
            let lector = new FileReader();
            lector.onload = (e) => {
                let parser = new DOMParser();
                let documento = parser.parseFromString(e.target.result, "text/html");
                
                // Buscamos todos los elementos con class="quote"
                let citas = documento.querySelectorAll("div.quote");
                
                datos_guardados.citas = [];
                resultadoCitas.innerHTML = "";

                // Recorremos todas las citas
                for (let cita of citas) {
                    let texto = cita.querySelector(".text")?.textContent?.trim() || "";
                    let autor = cita.querySelector(".author")?.textContent?.trim() || "";
                    
                    // querySelectorAll devuelve varios elementos
                    let tagsElements = cita.querySelectorAll(".tag");
                    let tags = [];
                    for (let t of tagsElements) {
                        tags.push(t.textContent.trim());
                    }

                    let dato = { texto: texto, autor: autor, tags: tags };
                    datos_guardados.citas.push(dato);

                    let item = crearItem();
                    item.innerText = dato.texto + " - " + dato.autor;
                    resultadoCitas.appendChild(item);
                }
            };
            lector.readAsText(archivo);
        };

        // =============================================
        // EVENTO: LEER ARCHIVO DE NOTICIAS
        // =============================================
        inputNoticias.onchange = (evento) => {
            seccion_actual = "noticias";
            let archivo = evento.target.files[0];
            if (!archivo) return;
            
            let lector = new FileReader();
            lector.onload = (e) => {
                let parser = new DOMParser();
                let documento = parser.parseFromString(e.target.result, "text/html");
                
                // Buscamos todas las filas de noticias
                let filas = documento.querySelectorAll("tr.athing");
                
                datos_guardados.noticias = [];
                resultadoNoticias.innerHTML = "";

                let ranking = 1;
                // Solo las primeras 15 noticias
                for (let fila of filas) {
                    if (ranking > 15) break;
                    
                    let enlace = fila.querySelector("td.title a");
                    let sitebit = fila.querySelector(".sitebit a")?.textContent?.trim() || "";
                    
                    // Las noticias tienen informacion extra en la siguiente fila (subtext)
                    let subtext = fila.nextElementSibling?.querySelector("td.subtext");
                    let score = subtext?.querySelector(".score")?.textContent?.trim() || "0 points";
                    let usuario = subtext?.querySelector("a.hnuser")?.textContent?.trim() || "";
                    let fecha = subtext?.querySelector("span.age")?.textContent?.trim() || "";

                    let dato = {
                        rank: ranking,
                        titulo: enlace?.textContent?.trim() || "Sin titulo",
                        enlace: enlace?.href || "",
                        dominio: sitebit,
                        puntos: score,
                        autor: usuario,
                        fecha: fecha
                    };
                    datos_guardados.noticias.push(dato);

                    let item = crearItem();
                    item.innerText = dato.rank + ". " + dato.titulo + " (" + dato.puntos + ")";
                    resultadoNoticias.appendChild(item);
                    ranking++;
                }
            };
            lector.readAsText(archivo);
        };
    }

    // =============================================
    // FUNCIONES AUXILIARES
    // =============================================

    // Crea una seccion con un titulo
    function crearSeccion(titulo) {
        let seccion = document.createElement("div");
        seccion.style.marginTop = "20px";

        let h2 = document.createElement("h2");
        h2.innerText = titulo;
        seccion.appendChild(h2);

        return seccion;
    }

    // Crea un input para seleccionar archivo
    function crearInputArchivo(texto) {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = ".html"; // Solo acepta archivos .html
        
        let label = document.createElement("label");
        label.innerText = texto + ": ";
        label.appendChild(input);

        return label; // Devuelve el label (que contiene el input)
    }

    // Crea un contenedor vazio para resultados
    function crearContenedorResultados() {
        let contenedor = document.createElement("div");
        contenedor.style.marginTop = "10px";
        return contenedor;
    }

    // Crea un div simple para cada resultado
    function crearItem() {
        let item = document.createElement("div");
        item.style.marginBottom = "5px";
        return item;
    }

    // Crea un contenedor vacío para el iframe
    function crearContenedorIframe() {
        let contenedor = document.createElement("div");
        contenedor.style.marginTop = "10px";
        return contenedor;
    }

    // Exporta JSON individual de la sección, lo muestra en iframe y descarga automáticamente
    function exportarJsonIndividual(tipo, contenedorIframe) {
        let datos = datos_guardados[tipo];
        
        if (!datos || datos.length === 0) {
            alert("No hay datos para exportar. Selecciona un archivo primero.");
            return;
        }
        
        let json = JSON.stringify(datos, null, 2);
        
        // Crear blob y URL
        let blob = new Blob([json], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        
        // Crear iframe
        let iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.style.width = "100%";
        iframe.style.height = "300px";
        iframe.style.border = "1px solid #ccc";
        
        // Limpiar y añadir iframe al contenedor
        contenedorIframe.innerHTML = "";
        contenedorIframe.appendChild(iframe);
        
        // Descargar automáticamente
        let a = document.createElement("a");
        a.href = url;
        a.download = `scraped_${tipo}.json`;
        a.click();
    }

    // Arrancar la funcion iniciar cuando cargue la pagina
    window.onload = iniciar;
</script>
</body>
</html>
