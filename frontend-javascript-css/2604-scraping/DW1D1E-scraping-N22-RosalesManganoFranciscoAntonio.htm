<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let exportJson = { data: [] };
        function iniciar() {
            let body = document.body;

            let tituloPrinciapal = document.createElement("h1");
            tituloPrinciapal.innerText = "Scraping";
            body.appendChild(tituloPrinciapal);

            // SECCION 1

            seccion1();

            // SECCION 2

            seccion2();

            // SECCION 3

            seccion3();

        }

        function seccion3() {
            let body = document.body;
            let seccion3 = document.createElement("div");
            let titulo = document.createElement("h3");
            titulo.innerHTML = "Noticias";
            let input = document.createElement("input");
            input.type = "file";
            input.accept = ".html";

            body.appendChild(seccion3);
            seccion3.appendChild(titulo);
            seccion3.appendChild(input);

            input.onchange = (evento) => {
                let anterior = document.getElementById("vistaNoticias");
                if (anterior) {
                    anterior.remove();
                }
                let archivo = evento.target.files[0];
                let lector = new FileReader();
                lector.onload = (e) => {
                    let parser = new DOMParser();
                    let dom = parser.parseFromString(e.target.result, "text/html");
                    

                    let nodosTitulos = dom.querySelectorAll("span.titleline a");
                    console.log(nodosTitulos);

                    let arrTitulos = [...nodosTitulos].map(nodo => nodo.textContent);
                    let arrLinks = [...nodosTitulos].map(nodo => nodo.href);
                    console.log(arrTitulos);
                    console.log(arrLinks);

                    exportJson = { data: [] };
                    arrTitulos.forEach((ele, i) => {
                        let noticia = {
                            titulo: arrTitulos[i],
                            link: arrLinks[i]
                        };
                        exportJson.data[i] = noticia;
                    });

                    let tablaJson = crearTabla(exportJson);
                    seccion3.appendChild(tablaJson);

                    let iframe = document.createElement("iframe");
                    iframe.id = "vistaNoticias";
                    iframe.style.display = "block";
                    iframe.style.width = "800px";
                    iframe.style.height = "600px";
                    iframe.style.marginTop = "10px";
                    let jsonString = JSON.stringify(exportJson, null, 4);

                    let blob = new Blob([jsonString], { type: "application/json" });
                    let url = URL.createObjectURL(blob);

                    iframe.src = url;

                    seccion3.appendChild(iframe);

                    // crear un elemento <a> oculto para forzar la descarga
                    let link = document.createElement("a");
                    link.href = url;
                    let timeStamp = new Date();
                    // Nombre del archivo al descargar
                    link.download = `data-noticias-${timeStamp.getTime()}.json`;

                    // simular el clic y limpiar
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    // liberar memoria
                    window.URL.revokeObjectURL(url);



                };
                lector.readAsText(archivo);
            };
        }

        function seccion2() {
            let body = document.body;
            let seccion2 = document.createElement("div");
            let titulo = document.createElement("h3");
            titulo.innerHTML = "Citas";
            let btnFetch = document.createElement("button");
            btnFetch.innerText = "Iniciar peticion";

            body.appendChild(seccion2);
            seccion2.appendChild(titulo);
            seccion2.appendChild(btnFetch);

            btnFetch.onclick = () => {
                let anterior = document.getElementById("vistaCitas");
                if (anterior) {
                    anterior.remove();
                }
                const targetUrl = 'https://quotes.toscrape.com/';
                const xhr = new XMLHttpRequest();
                xhr.open('GET', targetUrl, true);
                xhr.onload = function () {
                    let datos = xhr.responseText;
                    let parser = new DOMParser();
                    let dom = parser.parseFromString(datos, "text/html");

                    let nodosCitas = dom.querySelectorAll("span.text");
                    let arrCitas = [...nodosCitas].map(nodo => nodo.textContent);
                    console.log(arrCitas);

                    let nodosAutores = dom.querySelectorAll("small.author");
                    let arrAutores = [...nodosAutores].map(nodo => nodo.textContent);
                    console.log(arrAutores);

                    exportJson = { data: [] };
                    arrAutores.forEach((ele, i) => {
                        let cita = {
                            cita: arrCitas[i],
                            autor: arrAutores[i]
                        };
                        exportJson.data[i] = cita;
                    });

                    let tablaJson = crearTabla(exportJson);
                    seccion2.appendChild(tablaJson);

                    let iframe = document.createElement("iframe");
                    iframe.id = "vistaCitas";
                    iframe.style.display = "block";
                    iframe.style.width = "800px";
                    iframe.style.height = "600px";
                    iframe.style.marginTop = "10px";
                    let jsonString = JSON.stringify(exportJson, null, 4);

                    let blob = new Blob([jsonString], { type: "application/json" });
                    let url = URL.createObjectURL(blob);

                    iframe.src = url;

                    seccion2.appendChild(iframe);

                    // crear un elemento <a> oculto para forzar la descarga
                    let link = document.createElement("a");
                    link.href = url;
                    let timeStamp = new Date();
                    // Nombre del archivo al descargar
                    link.download = `data-citas-${timeStamp.getTime()}.json`;

                    // simular el clic y limpiar
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    // liberar memoria
                    window.URL.revokeObjectURL(url);


                };
                xhr.send();
            };
        }

        function seccion1() {
            let body = document.body;
            let seccion1 = document.createElement("div");
            let titulo = document.createElement("h3");
            titulo.innerHTML = "Libros";
            let btnFetch = document.createElement("button");
            btnFetch.innerText = "Iniciar peticion";

            body.appendChild(seccion1);
            seccion1.appendChild(titulo);
            seccion1.appendChild(btnFetch);

            btnFetch.onclick = () => {
                let anterior = document.getElementById("vistaLibros");
                if (anterior) {
                    anterior.remove();
                }

                let datos = "";

                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://books.toscrape.com/', true);
                xhr.onreadystatechange = function () {
                    if (xhr.readyState == 4 && xhr.status == 200) {
                        datos = xhr.responseText;
                        let parser = new DOMParser();
                        let dom = parser.parseFromString(datos, "text/html");
                        datos = dom;
                        console.log(datos);

                        let nodosTitulos = datos.querySelectorAll(".product_pod h3 a");
                        let arrTitulos = Array.from(nodosTitulos).map(nodo => nodo.title);

                        console.log(arrTitulos);

                        let nodosPrecios = datos.querySelectorAll(".product_pod p.price_color");
                        let arrPrecios = [...nodosPrecios].map(nodo => nodo.innerText);
                        console.log(arrPrecios);

                        let jsonLibros = [...nodosTitulos].forEach((nodosTitulos, i) => {
                            let libro = {
                                titulo: arrTitulos[i],
                                precio: arrPrecios[i]
                            };
                            exportJson.data[i] = libro;
                        });

                        let tablaJson = crearTabla(exportJson);
                        seccion1.appendChild(tablaJson);

                        let iframe = document.createElement("iframe");
                        iframe.id = "vistaLibros";
                        iframe.style.display = "block";
                        iframe.style.width = "800px";
                        iframe.style.height = "600px";
                        iframe.style.marginTop = "10px";
                        let jsonString = JSON.stringify(exportJson, null, 4);

                        let blob = new Blob([jsonString], { type: "application/json" });
                        let url = URL.createObjectURL(blob);

                        iframe.src = url;

                        seccion1.appendChild(iframe);

                        // crear un elemento <a> oculto para forzar la descarga
                        let link = document.createElement("a");
                        link.href = url;
                        let timeStamp = new Date();
                        // Nombre del archivo al descargar
                        link.download = `data-libros-${timeStamp.getTime()}.json`;

                        // simular el clic y limpiar
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        // liberar memoria
                        window.URL.revokeObjectURL(url);

                    }
                };
                xhr.send();





            };
        }

        function crearTabla(json) {
            const tabla = document.createElement("table");
            tabla.border = 1;

            const datos = json.data;
            const columnas = Object.keys(datos[0]);

            // Encabezado
            const tr = document.createElement("tr");
            columnas.forEach(c => {
                const th = document.createElement("th");
                th.textContent = c;
                tr.appendChild(th);
            });
            tabla.appendChild(tr);

            // Filas
            datos.forEach(obj => {
                const tr = document.createElement("tr");
                columnas.forEach(c => {
                    const td = document.createElement("td");
                    td.textContent = obj[c];
                    tr.appendChild(td);
                });
                tabla.appendChild(tr);
            });

            return tabla;
        }


        window.onload = iniciar;
    </script>
