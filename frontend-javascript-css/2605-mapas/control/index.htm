<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .z {
            margin: 10px;
            border: 1px solid black;
            width: 300px;
            padding: 10px;
        }

        #mapid {
            width: 600px;
            height: 300px;
        }
    </style>

    <script>
        const coordenadasOslo = [59.913333333333, 10.738888888889];

        function iniciar() {
            console.log('inicio');

            // contenedor mapa
            let contenedor = document.createElement('div');
            document.body.appendChild(contenedor);
            contenedor.id = 'mapid';

            // centro mapa y zoom
            var map = L.map('mapid').setView(coordenadasOslo, 12);
            map.on('zoomend', (e) => {
                let zoom = map.getZoom();
                let campo = document.getElementById('zoom');
                campo.value = zoom;
            });

            // tipo de mapa
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            //icono hoja
            let greenIcon = L.icon({
                iconUrl: 'leaf-green.png',
                shadowUrl: 'leaf-shadow.png',

                iconSize: [38, 95], // size of the icon
                shadowSize: [50, 64], // size of the shadow
                iconAnchor: [22, 94], // point of the icon which will correspond to marker's location
                shadowAnchor: [4, 62],  // the same for the shadow
                popupAnchor: [-3, -76] // point from which the popup should open relative to the iconAnchor
            });

            // marcador
            let marcador = L.marker(coordenadasOslo, { icon: greenIcon }).addTo(map);
            marcador.bindPopup("<b>OSLO</b><br>un marcador").openPopup();


            br();

            // campo zoom
            let labelZoom = document.createElement('label');
            labelZoom.innerText = 'zoom: ';
            document.body.appendChild(labelZoom);
            let inputZoom = document.createElement('input');
            inputZoom.id = 'zoom';
            inputZoom.value = map.getZoom();
            inputZoom.setAttribute('type', 'text');
            labelZoom.appendChild(inputZoom);


            br();
            br();

            // campo coordenadas
            let labelCoo = document.createElement('label');
            labelCoo.innerText = 'coordenadas: ';
            document.body.appendChild(labelCoo);
            let inputCoo = document.createElement('input');
            inputCoo.id = 'centro';
            let lat = map.getCenter().lat;
            let lng = map.getCenter().lng;
            inputCoo.value = `lat: ${Number(lat.toFixed(5))} - long: ${Number(lng.toFixed(5))}`;
            inputCoo.setAttribute('type', 'text');
            labelCoo.appendChild(inputCoo);
            
            // evento para actualizar el centro
            function onMapClick(e) {
                let coordenadas = document.getElementById('centro');
                coordenadas.value = e.latlng;  
            }
            map.on('click', onMapClick);

            br();
            br();

            // campo circulo
            let label = document.createElement('label');
            label.innerText = 'Circulo: ';
            
            let input = document.createElement('input');
            input.setAttribute('type', 'checkbox');
            label.appendChild(input);

            document.body.appendChild(label);

            input.addEventListener('change', () => {
                let ele = document.querySelector('path.circulo1');
                if (ele) {
                    ele.remove();
                } else {
                    let circle = L.circle([59.92, 10.70], {
                        color: 'red',
                        fillColor: '#f03',
                        fillOpacity: 0.5,
                        radius: 1500,
                        className: 'circulo1'
                    }).addTo(map);
                }
            });

            br();

            //campo cuadrado
            
            let labelCuadrado = document.createElement('label');
            labelCuadrado.innerText = 'cuadrado: ';
            
            let inputCuadrado = document.createElement('input');
            inputCuadrado.setAttribute('type', 'checkbox');
            labelCuadrado.appendChild(inputCuadrado);

            document.body.appendChild(labelCuadrado);

            inputCuadrado.addEventListener('change', () => {
                let ele = document.querySelector('path.cuadrado1');
                if (ele) {
                    ele.remove();
                } else {
                    var polygon = L.polygon([
                        [59.95, 10.75],
                        [59.95, 10.8],
                        [59.89, 10.8],
                        [59.89, 10.75]
                    ],{
                        color: 'red',
                        className: 'cuadrado1'
                    }).addTo(map);
                }
            });

            


            /*

            var marker = L.marker([59.93, 10.8]).addTo(map);

            var polygon = L.polygon([
                [28.62, 77.20],
                [28.61, 77.19],
                [28.60, 77.19],
                [28.60, 77.22],
                [28.61, 77.23]
            ]).addTo(map);
            */
        }

        function br(){
            let ele = document.createElement('br');
            document.body.appendChild(ele);
        }

        window.onload = iniciar;
    </script>
</head>

<body>

</body>

</html>
