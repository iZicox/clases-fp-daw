<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function iniciar (){

            let track1 = divAudio('Track1','mp3/track1.mp3');
            track1.addEventListener('click', () => {
                document.getElementById('Track1').play();
                console.log('play');
            });
            let track2 = divAudio('Track2','mp3/track1.mp3');
            let track3 = divAudio('Track3','mp3/track1.mp3');
            let parar = divAudio('parar');
            document.body.appendChild(track1);
            document.body.appendChild(track2);
            document.body.appendChild(track3);
            document.body.appendChild(parar);
        }

        function divAudio(inner,audioSrc){
            let ele = document.createElement('div');
            ele.style.width = '100px';
            ele.style.height = '30px';
            ele.style.display = 'flex';
            ele.style.justifyContent = 'center';
            ele.style.alignItems = 'center';
            ele.style.border = '1px solid';
            ele.style.margin = '10px';
            ele.innerText = inner;
            ele.addEventListener('mouseover', () => {
                ele.style.backgroundColor = 'yellow';
            });
            ele.addEventListener('mouseleave', () => {
                ele.style.backgroundColor = 'white';
            });
            let audio = document.createElement('audio');
            audio.setAttribute('src',audioSrc);
            audio.id = inner;
            ele.appendChild(audio);
            return ele;
        }



        window.onload=iniciar;
    </script>
</head>
<body>
    
</body>
</html>
