<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function iniciar(){
            for(let i = 0; i < 40; i ++){
                let n = 'H';
                let ele = crearNodo('div', n);
                
                ele.style.width = '100px';
                ele.style.height = '100px';
                ele.style.margin = '10px';
                ele.style.backgroundColor = 'aqua';
                ele.style.float = 'left';
                if((i%8) === 0 && i !== 0){
                    ele.style.clear = 'both';
                    //ele.style.removeProperty('float');
                }
                ele.addEventListener('click', function (){
                    window.alert('caja'+(i+1))
                });
            }
        }

        function crearNodo(tipo, inner){
            var ele = document.createElement(tipo);
            document.body.appendChild(ele);
            ele.innerHTML = inner;
            return ele;
        }

        window.onload = iniciar;
    </script>
</head>

</body>
</html>
